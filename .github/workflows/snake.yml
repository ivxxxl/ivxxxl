# Змейка, которая «съедает» квадратики графика активности. Обновляется раз в день, кладёт картинки в ветку output.
name: snake
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#2f6f5e&color_dots=#ebedf0,#c6e48b,#7bc96f,#239a3b,#196127
            dist/snake-dark.svg?palette=github-dark&color_snake=#7fd1b9
      - uses: crazy-max/ghaction-github-pages@v4
        with: { target_branch: output, build_dir: dist }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
